name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same one command the contributor runs locally (see CLAUDE.md). Kept as a single
      # step deliberately: four steps here and one script there is how the two drift, and the
      # whole point of `check` is that local green and CI green mean the same thing.
      - run: pnpm check
